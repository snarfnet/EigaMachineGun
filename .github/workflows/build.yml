name: Build and Upload to App Store

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ASC_KEY_ID: "WDXGY9WX55"
  ASC_ISSUER_ID: "2be0734f-943a-4d61-9dc9-5d9045c46fec"

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select latest Xcode
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Using: $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH"
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set build number
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + 20 ))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Import Distribution Certificate
      env:
        CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        echo "$CERT_BASE64" | base64 -D > cert.p12
        security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        rm cert.p12
        echo "Imported certificates:"
        security find-identity -v -p codesigning build.keychain

    - name: Setup ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

    - name: Build archive
      run: |
        xcodebuild archive \
          -scheme EigaMachineGun \
          -archivePath build/EigaMachineGun.xcarchive \
          -destination "generic/platform=iOS" \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
          -authenticationKeyID ${ASC_KEY_ID} \
          -authenticationKeyIssuerID ${ASC_ISSUER_ID} \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          DEVELOPMENT_TEAM=83VGKGSQUH

    - name: Export & Upload
      run: |
        cat > ExportOptions.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>destination</key>
          <string>upload</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>teamID</key>
          <string>83VGKGSQUH</string>
          <key>provisioningProfiles</key>
          <dict>
            <key>com.tokyonasu.eigamachinegun</key>
            <string>EigaMachineGun AppStore</string>
          </dict>
        </dict>
        </plist>
        PLIST

        xcodebuild -exportArchive \
          -archivePath build/EigaMachineGun.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath build/export \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
          -authenticationKeyID ${ASC_KEY_ID} \
          -authenticationKeyIssuerID ${ASC_ISSUER_ID}

    - name: Cleanup
      if: always()
      run: |
        security delete-keychain build.keychain 2>/dev/null || true
        rm -rf ~/private_keys
      continue-on-error: true
